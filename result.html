<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"></meta>
        <title>遇到的問題與解決方法</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
        <h1>⚠️遇到的問題與解決方法</h1>
        </header>

        <div class="content">

        <p>
        在製作網站的過程中，遇到了一些問題，
        透過查詢教學影片、網路資料及反覆練習，
        最終成功完成網站。
        </p>

        <table>

        <tr>
        <th>遇到的問題</th>
        <th>解決方法</th>
        </tr>

        <tr>
        <td>CSS 樣式沒有顯示。</td>
        <td>確認 HTML 是否加入 <code>&lt;link rel="stylesheet" href="style.css"&gt;</code>，並檢查 CSS 檔案名稱是否正確。</td>
        </tr>

        <tr>
        <td>圖片無法顯示。</td>
        <td>檢查圖片檔名及路徑是否正確，確認圖片與 HTML 放在相對應的位置。</td>
        </tr>

        <tr>
        <td>首頁卡片排版不整齊。</td>
        <td>利用 CSS 排版，並調整 <code>padding</code>、<code>gap</code> 與卡片大小，使版面一致。</td>
        </tr>

        <tr>
        <td>點擊按鈕後無法切換頁面。</td>
        <td>確認 <code>href</code> 連結與HTML檔名一致，避免拼寫錯誤。</td>
        </tr>

        </table>

        <br>

        <a href="index.html">← 回首頁</a>

        </div>

    </body>
</html>
